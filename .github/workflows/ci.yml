name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (Biome)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The hot path benchmarks, in core and through the Express middleware: fail
  # when any p99 is 5 ms or more (docs/SPEC.md section 10, docs/benchmark.md).
  bench:
    name: Bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bench
        run: pnpm bench

  # Starts each example app from the built packages (two Express apps, a
  # Next.js 16 app and a Next.js 15 app) and checks verdict headers, enforced
  # responses and counters against a mock ingest server.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The WordPress plugin: every conformance vector through the PHP port, the
  # port checks, and the WordPress Coding Standards (packages/wordpress).
  wordpress-php:
    name: WordPress plugin (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.4"]
    defaults:
      run:
        working-directory: packages/wordpress
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          tools: composer:v2
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Unit and conformance tests
        run: composer test

      - name: Coding standards (PHPCS)
        run: composer lint

  # The plugin in a real WordPress (wp-env, Docker) with WooCommerce: labeling,
  # counters, admin pages, sign-ups, fail-open cases, uninstall, Plugin Check.
  wordpress-e2e:
    name: WordPress end-to-end (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: End-to-end
        run: pnpm --filter @posterna/wordpress-plugin test:wp
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
          POSTERNA_E2E_LIVE: "0"

      - name: Plugin Check
        if: matrix.php == '8.4'
        run: pnpm --filter @posterna/wordpress-plugin plugin-check
