slug: openai
name: OpenAI
website: https://openai.com/
docs_url: https://developers.openai.com/api/docs/bots
checked_on: "2026-10-26"

# "ChatGPT Agent" has no entry under agents: OpenAI's crawler page does not
# describe it, and the OpenAI help article that does could not be fetched
# (see signing.note). It stays a community agent of OpenAI.
community_agents: [ChatGPT Agent, ChatGPT-User, GPTBot, OAI-AdsBot, OAI-SearchBot, OpenAI]

sources:
  - id: bots
    url: https://developers.openai.com/api/docs/bots
    title: Overview of OpenAI Crawlers
  - id: castle
    url: https://blog.castle.io/how-to-authenticate-openai-operator-requests-using-http-message-signatures/
    title: How to authenticate OpenAI Operator requests using HTTP message signatures (Castle, third party)

agents:
  - name: GPTBot
    user_agent_tokens: [GPTBot]
    robots_token: GPTBot
    purpose: training
    purpose_quote: "It is used to crawl content that may be used in training our generative AI foundation models."
    purpose_source: bots
    search_engine: false
    robots_policy: honors
    robots_quote: "OpenAI uses OAI-SearchBot and GPTBot robots.txt tags to enable webmasters to manage how their sites and content work with AI."
    robots_source: bots
    ip_list: gptbot
    aliases: []
    aliases_source: null
    note: >-
      OpenAI frames a GPTBot disallow as a signal that content should not be used
      for training, and says that when a site allows both GPTBot and OAI-SearchBot
      it may use one crawl for both purposes. When fetching robots.txt the
      User-Agent may carry an extra "robots.txt" marker.

  - name: OAI-SearchBot
    user_agent_tokens: [OAI-SearchBot]
    robots_token: OAI-SearchBot
    purpose: search
    purpose_quote: "OAI-SearchBot is used to surface websites in search results in ChatGPT’s search features."
    purpose_source: bots
    search_engine: false
    robots_policy: honors
    robots_quote: "OpenAI uses OAI-SearchBot and GPTBot robots.txt tags to enable webmasters to manage how their sites and content work with AI."
    robots_source: bots
    ip_list: searchbot
    aliases: []
    aliases_source: null
    note: >-
      The documented User-Agent is a Chrome-like string with the OAI-SearchBot
      token appended. When fetching robots.txt it may carry an extra "robots.txt"
      marker. OpenAI says robots.txt changes can take about 24 hours to apply to
      search.

  - name: OAI-AdsBot
    user_agent_tokens: [OAI-AdsBot]
    robots_token: null
    purpose: ads
    purpose_quote: "OAI-AdsBot is used to validate the safety of web pages submitted as ads on ChatGPT."
    purpose_source: bots
    search_engine: false
    robots_policy: unstated
    robots_quote: null
    robots_source: null
    ip_list: adsbot
    aliases: []
    aliases_source: null
    note: >-
      OpenAI's page says nothing about robots.txt for OAI-AdsBot; its robots.txt
      sentence names only OAI-SearchBot and GPTBot, so robots_token is null. The
      page says it only visits landing pages submitted as ads and that its data is
      not used to train foundation models.

  - name: ChatGPT-User
    user_agent_tokens: [ChatGPT-User]
    robots_token: null
    purpose: user_fetch
    purpose_quote: "When users ask ChatGPT or a CustomGPT a question, it may visit a web page with a ChatGPT-User agent."
    purpose_source: bots
    search_engine: false
    robots_policy: may_ignore
    robots_quote: "Because these actions are initiated by a user, robots.txt rules may not apply."
    robots_source: bots
    ip_list: chatgpt-user
    aliases: []
    aliases_source: null
    note: >-
      Also used for GPT Actions. OpenAI names only OAI-SearchBot and GPTBot as
      robots.txt tags, so robots_token is null. OpenAI says ChatGPT-User does not
      decide whether content appears in search; OAI-SearchBot does.

ip_lists:
  - id: gptbot
    url: https://openai.com/gptbot.json
    source: bots
  - id: searchbot
    url: https://openai.com/searchbot.json
    source: bots
  - id: adsbot
    url: https://openai.com/adsbot.json
    source: bots
  - id: chatgpt-user
    url: https://openai.com/chatgpt-user.json
    source: bots

reverse_dns: null

asn: []

signing:
  directory_url: https://chatgpt.com/.well-known/http-message-signatures-directory
  basis: reported
  status: null
  covers: [ChatGPT Agent]
  note: >-
    The directory URL comes from a third-party write-up (Castle). OpenAI's own
    crawler page does not mention signing. OpenAI's help article on allowlisting
    ChatGPT agent (help.openai.com/en/articles/11845367, now titled "ChatGPT Work's
    Cloud browser allowlisting") appears from search results to document RFC 9421
    signing with Signature-Agent "https://chatgpt.com", but it returned HTTP 403 to
    curl and to WebFetch on 2026-10-26, so it is not cited here. If that article
    can be read, basis can become documented. ChatGPT agent is listed under covers
    by its ai.robots.txt key; it has no OpenAI-documented User-Agent token here.
  sources: [castle]
